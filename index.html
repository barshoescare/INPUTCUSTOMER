<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Bar Shoescare</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #1e1e1e; color: #ffffff; display: flex; min-height: 100vh; }
        
        .sidebar { width: 250px; background-color: #2b2d2f; padding: 20px; border-right: 2px solid #2ecc71; }
        .sidebar h2 { color: #2ecc71; margin-bottom: 30px; font-size: 22px; }
        .menu-btn { display: block; width: 100%; padding: 15px; margin-bottom: 10px; background: transparent; color: #fff; border: 1px solid #7f8c8d; border-radius: 5px; cursor: pointer; text-align: left; font-size: 16px; }
        .menu-btn.active, .menu-btn:hover { background-color: #2ecc71; color: #1e1e1e; border-color: #2ecc71; font-weight: bold; }

        .main-content { flex: 1; padding: 40px; }
        .tab-content { display: none; background-color: #2b2d2f; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .tab-content.active { display: block; }
        h3 { color: #2ecc71; margin-bottom: 20px; font-size: 24px; border-bottom: 1px solid #7f8c8d; padding-bottom: 10px; }

        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #bdc3c7; }
        input, select { width: 100%; padding: 10px; background-color: #1e1e1e; border: 1px solid #7f8c8d; color: #fff; border-radius: 5px; font-size: 16px; outline: none; }
        input:focus, select:focus { border-color: #2ecc71; }
        
        .locked-input { background-color: #333; color: #2ecc71; font-weight: bold; cursor: not-allowed; }

        .btn-submit { background-color: #2ecc71; color: #1e1e1e; padding: 12px 20px; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; }
        .btn-submit:hover { background-color: #27ae60; }

        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #7f8c8d; }
        th { color: #2ecc71; }
        .btn-delete { background-color: #e74c3c; color: white; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer; }
        .btn-delete:hover { background-color: #c0392b; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>Admin Panel</h2>
        <button class="menu-btn active" onclick="openTab('transaksi')">Input Transaksi</button>
        <button class="menu-btn" onclick="openTab('promo')">Kelola Promo</button>
    </div>

    <div class="main-content">
        
        <!-- TAB 1: TRANSAKSI -->
        <div id="transaksi" class="tab-content active">
            <h3>Input Transaksi Baru</h3>
            <form id="form-transaksi" onsubmit="simpanTransaksi(event)">
                <div class="form-group">
                    <label>Nama Pelanggan</label>
                    <input type="text" id="nama" placeholder="Masukkan nama..." required>
                </div>
                <div class="form-group">
                    <label>No. WhatsApp</label>
                    <input type="text" id="nowa" placeholder="Contoh: 0811..." required>
                </div>
                <div class="form-group">
                    <label>Warna Sepatu</label>
                    <input type="text" id="warna" placeholder="Contoh: Putih">
                </div>
                
                <div class="form-group">
                    <label>Layanan (Treatment)</label>
                    <select id="pilih-layanan" onchange="updateHarga()" required>
                        <option value="" data-price="0" disabled selected>-- Pilih Layanan --</option>
                        <option value="Standar Cleaning" data-price="30000">Standar Cleaning (Rp 30.000)</option>
                        <option value="Deep Clean Standar" data-price="40000">Deep Clean Standar (Rp 40.000)</option>
                        <option value="Deep Clean Premium" data-price="50000">Deep Clean Premium (Rp 50.000)</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Harga Dasar (Rp)</label>
                    <input type="number" id="harga-dasar" class="locked-input" value="0" readonly>
                </div>

                <div class="form-group">
                    <label>One Day Service</label>
                    <select id="pilih-oneday" onchange="hitungTotal()">
                        <option value="0">Tidak</option>
                        <option value="15000">Ya (+Rp 15.000)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Pilih Promo</label>
                    <select id="pilih-promo" onchange="hitungTotal()">
                        <option value="0">Tidak ada promo</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Total Tagihan (Rp)</label>
                    <input type="number" id="total-tagihan" class="locked-input" value="0" readonly>
                </div>
                
                <div class="form-group">
                    <label>Status Pembayaran</label>
                    <select id="status-bayar">
                        <option value="Belum Lunas">Belum Lunas</option>
                        <option value="Lunas">Lunas</option>
                    </select>
                </div>
                <button type="submit" id="btn-simpan" class="btn-submit">Simpan Transaksi</button>
            </form>
        </div>

        <!-- TAB 2: KELOLA PROMO -->
        <div id="promo" class="tab-content">
            <h3>Tambah Promo Baru</h3>
            <form id="form-promo" onsubmit="tambahPromo(event)" style="margin-bottom: 40px;">
                <div class="form-group">
                    <label>Kode Promo</label>
                    <input type="text" id="input-kode-promo" placeholder="Contoh: DISKON10K" required>
                </div>
                <div class="form-group">
                    <label>Potongan Harga (Rp)</label>
                    <input type="number" id="input-potongan" placeholder="Contoh: 10000" required>
                </div>
                <button type="submit" id="btn-simpan-promo" class="btn-submit">Simpan Promo</button>
            </form>

            <h3>Daftar Promo Aktif</h3>
            <table>
                <thead>
                    <tr>
                        <th>Kode Promo</th>
                        <th>Potongan</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="tabel-promo-body"></tbody>
            </table>
        </div>

    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyNUo5NP-JDgwU4Kh5b47a4CTxe2ulBd9S1OyYT_uN3EgG2hNEEbyLp7fwyn7mzK-EW/exec";

        let daftarPromo = [
            { kode: "OPENING20", potongan: 20000 }
        ];

        function openTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.menu-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        function updateHarga() {
            const selectLayanan = document.getElementById('pilih-layanan');
            const selectedOption = selectLayanan.options[selectLayanan.selectedIndex];
            const harga = selectedOption.getAttribute('data-price') || 0;
            
            document.getElementById('harga-dasar').value = harga;
            hitungTotal();
        }

        function hitungTotal() {
            const hargaDasar = parseFloat(document.getElementById('harga-dasar').value) || 0;
            const biayaOneDay = parseFloat(document.getElementById('pilih-oneday').value) || 0;
            const potonganPromo = parseFloat(document.getElementById('pilih-promo').value) || 0;
            
            let total = (hargaDasar + biayaOneDay) - potonganPromo;
            if(total < 0) total = 0; 

            document.getElementById('total-tagihan').value = total;
        }

        function renderPromo() {
            const tbody = document.getElementById('tabel-promo-body');
            const selectPromo = document.getElementById('pilih-promo');
            
            tbody.innerHTML = '';
            selectPromo.innerHTML = '<option value="0">Tidak ada promo</option>';

            daftarPromo.forEach((p, index) => {
                tbody.innerHTML += `
                    <tr>
                        <td>${p.kode}</td>
                        <td>Rp ${p.potongan.toLocaleString('id-ID')}</td>
                        <td><button class="btn-delete" onclick="hapusPromo('${p.kode}', ${index})">Hapus</button></td>
                    </tr>
                `;

                selectPromo.innerHTML += `
                    <option value="${p.potongan}">${p.kode} - Potongan Rp ${p.potongan.toLocaleString('id-ID')}</option>
                `;
            });
            hitungTotal();
        }

        function tambahPromo(event) {
            event.preventDefault();
            const btnPromo = document.getElementById('btn-simpan-promo');
            btnPromo.textContent = "Menyimpan...";
            btnPromo.disabled = true;

            const kode = document.getElementById('input-kode-promo').value.trim().toUpperCase();
            const potongan = parseFloat(document.getElementById('input-potongan').value) || 0;

            const dataPromo = {
                type: "promo",
                kode: kode,
                potongan: potongan
            };

            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dataPromo)
            })
            .then(() => {
                daftarPromo.push({ kode: kode, potongan: potongan });
                document.getElementById('form-promo').reset();
                renderPromo();
                alert('Promo berhasil disimpan ke Database!');
                btnPromo.textContent = "Simpan Promo";
                btnPromo.disabled = false;
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Gagal menyimpan promo.');
                btnPromo.textContent = "Simpan Promo";
                btnPromo.disabled = false;
            });
        }

        function hapusPromo(kode, index) {
            if(confirm(`Yakin ingin menghapus promo ${kode}?`)) {
                const dataHapus = {
                    type: "hapus_promo",
                    kode: kode
                };

                fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dataHapus)
                })
                .then(() => {
                    daftarPromo.splice(index, 1);
                    renderPromo();
                    alert('Promo berhasil dihapus dari database!');
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('Gagal menghapus promo.');
                });
            }
        }

        renderPromo();

        function simpanTransaksi(event) {
            event.preventDefault();
            const btnSimpan = document.getElementById('btn-simpan');
            btnSimpan.textContent = "Menyimpan...";
            btnSimpan.disabled = true;

            const dataTransaksi = {
                type: "transaksi",
                nama: document.getElementById('nama').value,
                nowa: document.getElementById('nowa').value,
                warna: document.getElementById('warna').value,
                layanan: document.getElementById('pilih-layanan').value,
                harga: document.getElementById('harga-dasar').value,
                oneday: document.getElementById('pilih-oneday').options[document.getElementById('pilih-oneday').selectedIndex].text,
                promo: document.getElementById('pilih-promo').options[document.getElementById('pilih-promo').selectedIndex].text,
                total: document.getElementById('total-tagihan').value,
                status: document.getElementById('status-bayar').value
            };

            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dataTransaksi)
            })
            .then(() => {
                alert('Transaksi berhasil disimpan ke Database!');
                document.getElementById('form-transaksi').reset();
                document.getElementById('harga-dasar').value = 0;
                document.getElementById('total-tagihan').value = 0;
                btnSimpan.textContent = "Simpan Transaksi";
                btnSimpan.disabled = false;
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Gagal menyimpan transaksi.');
                btnSimpan.textContent = "Simpan Transaksi";
                btnSimpan.disabled = false;
            });
        }
    </script>
</body>
</html>
